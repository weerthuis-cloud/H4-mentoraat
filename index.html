<html lang="nl">

<title>Mijn jaarlijn havo 4</title>
<style>
:root{

  --warm:var(--c-toets); --warm-soft:#fdf0dc; --ok:#2e7d32; --ok-soft:#e7f2e2;
  --lob:var(--c-lob); --lob-soft:#e7f2e2; --geel-soft:#fff4d6;
  --b1:#c7d6e8; --b2:#7ea7d2; --b3:#2f73b8; --b4:#0a4a8a; --b5:#f39200;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
body[data-thema="lob"]{ --acc:var(--c-lob); --acc-soft:#e7f2e2; }
body[data-thema="mentor"]{ --acc:var(--c-mentor); --acc-soft:#fbe8e7; }

  :root{
    --c-leerling:#6aa8e6; --c-lob:#79c27c; --c-mentor:#f07a7f; --c-toets:#f0a24a; --c-geel:#f5c24a;
    --bg:#15181b; --card:#1e2226; --ink:#e7e9ea; --muted:#a0a7ae; --line:#343a40;
    --acc-soft:#1c2c3d; --acc-ink:#0d1620;
    --warm-soft:#3a2a15; --ok:#79c27c; --ok-soft:#1c3220; --lob-soft:#1c3220; --geel-soft:#3a3010;

  }

  body[data-thema="mentor"]{ --acc-soft:#3a1c1e; }
}
[hidden]{display:none!important}
h2.mper{margin:26px 0 10px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wkrow{display:grid;grid-template-columns:110px 1fr 210px;gap:14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c-leerling);border-radius:10px;padding:12px 14px;margin:0 0 8px}

.wkcol .lesnr{margin-top:4px;display:inline-block;font-weight:700;color:var(--ink)}

.wkside{font-size:13px} .wkside .dl{font-weight:700;margin-bottom:4px}

.brand{display:flex;align-items:center;gap:12px}

.c-leerling{color:var(--c-leerling)} .c-lob{color:var(--c-lob)} .c-toets{color:var(--c-toets)}

body[data-thema="mentor"] header.top{border-bottom:3px solid var(--c-mentor)}
body[data-thema="lob"] header.top{border-bottom:3px solid var(--c-lob)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

h1{font-size:26px;line-height:1.2;margin:26px 0 6px;letter-spacing:-.015em}

.f{display:block;margin:0 0 14px}
.lab{display:block;font-weight:600;margin-bottom:2px}
.hint{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
textarea,input[type=text],input[type=password],input[type=date],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:60px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}

.radios{display:grid;gap:8px;margin:4px 0 14px}
.radios.cols4{grid-template-columns:repeat(4,1fr)}
.radios.cols5{grid-template-columns:repeat(5,1fr)}
.radios.cols3{grid-template-columns:repeat(3,1fr)}
.radios.cols2{grid-template-columns:repeat(2,1fr)}

.radios.inline{display:flex;flex-wrap:wrap;gap:5px;margin:0}

.check{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;cursor:pointer}

.tag{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}

.btn{font:inherit;font-size:15px;border-radius:9px;padding:9px 16px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer;font-weight:600}

.btn.small{font-size:13px;padding:5px 10px}
.btn.danger{border-color:var(--warm);color:var(--warm);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between;margin-top:8px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.steps button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.domain-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.domain-h .q{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt td,.vt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.vt th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
.vt input[type=text]{padding:5px 7px;font-size:14px}
.vt input.cijfer{width:64px}
.vt td.vak{font-weight:600;white-space:nowrap}
.vt tr.off td:not(:first-child):not(:nth-child(2)){opacity:.35}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.swot{grid-template-columns:1fr}}
.swot .q{border-radius:10px;padding:12px;border:1px solid var(--line)}
.swot .q h3{margin:0 0 2px}
.swot .q.s{background:var(--ok-soft);border-color:transparent}
.swot .q.w{background:var(--warm-soft);border-color:transparent}
.swot .q.k{background:var(--acc-soft);border-color:transparent}
.swot input{margin-bottom:6px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.badge{font-size:13px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--line);color:var(--muted)}
.badge.on{background:var(--ok);color:#fff}
.zin{border-left:4px solid var(--acc);padding:8px 12px;background:var(--acc-soft);border-radius:0 8px 8px 0;margin:6px 0 4px;font-size:15px}
.zin.leeg{color:var(--muted);border-color:var(--line);background:transparent}
details{margin:0 0 12px}
details summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:600}
details .ex{font-size:14px;color:var(--muted);margin:6px 0 0;padding-left:12px;border-left:2px solid var(--line)}
.alert{border-radius:10px;padding:10px 12px;background:var(--warm-soft);font-size:14px;margin:0 0 12px}
.note{border-radius:10px;padding:10px 12px;background:var(--acc-soft);font-size:14px;margin:0 0 12px}
.gap{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 12px}
.gap td,.gap th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.gap th{color:var(--muted);font-weight:600;font-size:13px}
.flag{color:var(--warm);font-weight:600}
.chart{display:grid;gap:16px}
.chart .rowc{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:end}

.bars{display:flex;gap:6px;align-items:flex-end;height:78px;border-bottom:1px solid var(--line)}
.bar{flex:1;max-width:56px;border-radius:5px 5px 0 0;position:relative;min-height:2px}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.tl{display:grid;gap:8px}

.small{font-size:13px;color:var(--muted)}

  header.top,.wrap{display:none!important}
  body{background:#fff;color:#000;font-size:10.5pt}

<body>

<header class="top">
  <div class="strip" aria-hidden="true"></div>
  <div class="top-in">

/* ---------- opslag ---------- */
function blank(){
  return { versie:2, leerling:{voornaam:"",klas:"",profiel:"",groep:""}, meta:{}, lessen:{}, gesprek:{}, cfg:null, vakken:[], doelenA:[{},{}], doelenB:[{},{}],
           m:{ spiegel:{ fb:[{rol:"Vakdocent"},{rol:"Klasgenoot"},{rol:"Ouder of verzorger"}] } },
           ui:{ tab:"start", privacyOk:false } };
}
let storageOk = true;
function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ storageOk = false; return null; } }
let S = Object.assign(blank(), load() || {});
S.m = S.m || {}; S.meta = S.meta || {}; S.lessen = S.lessen || {}; S.gesprek = S.gesprek || {};
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const el = document.getElementById("save");
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true;
      el.textContent = (MENTOR && mentorSub() !== "voorbeeld") ? "" : "Opgeslagen op dit apparaat · " + new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}); el.classList.remove("err");
    } catch(e){ storageOk = false; el.textContent = "Opslaan lukt niet. Maak nu een back-up!"; el.classList.add("err"); }
  }, 250);
}
function get(p){ return p.split(".").reduce((o,k) => (o == null ? undefined : o[k]), S); }
function set(p, v){
  const ks = p.split("."); let o = S;
  for (let i = 0; i < ks.length - 1; i++){
    if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = /^\d+$/.test(ks[i+1]) ? [] : {};
    o = o[ks[i]];
  }
  o[ks[ks.length-1]] = v; save();
}

/* ---------- hulpfuncties ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function vkey(v){ return String(v).replace(/[.\s]+/g,"_"); }
function fmtDate(iso){ if(!iso) return ""; const d = new Date(iso+"T12:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("nl-NL",{day:"numeric",month:"long"}); }
function filled(v){ return v !== undefined && v !== null && v !== "" && v !== false; }
function hasContent(o){ if (o == null) return false; if (typeof o !== "object") return filled(o);
  return Object.entries(o).some(([k,v]) => k !== "klaar" && k !== "rol" && hasContent(v)); }
function num(v){ if (v == null || v === "") return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; }
function nl(n, d=1){ return n == null ? "–" : n.toFixed(d).replace(".", ","); }

function ta(p, label, hint="", rows=3, ph=""){
  return `<label class="f"><span class="lab">${label}</span>${hint?`<span class="hint">${hint}</span>`:""}<textarea data-p="${p}" rows="${rows}" placeholder="${esc(ph)}">${esc(get(p))}</textarea></label>`; }
function inp(p, label, hint="", type="text", ph=""){
  return `<label class="f"><span class="lab">${label}</span>${hint?`<span class="hint">${hint}</span>`:""}<input type="${type}" data-p="${p}" value="${esc(get(p))}" placeholder="${esc(ph)}"></label>`; }
function sel(p, label, opts, hint=""){ const cur = get(p) ?? "";
  return `<label class="f"><span class="lab">${label}</span>${hint?`<span class="hint">${hint}</span>`:""}<select data-p="${p}"><option value="">Kies…</option>${opts.map(o=>`<option ${String(cur)===String(o)?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`; }
function radios(p, opts, cls="", isNum=false){ const cur = get(p);
  return `<div class="radios ${cls}" role="radiogroup">${opts.map(o => `<label class="opt"><input type="radio" name="${p}" data-p="${p}" ${isNum?"data-n":""} value="${esc(o.v)}" ${String(cur)===String(o.v)?"checked":""}><span>${o.lvl?`<span class="lvl">${o.v}</span>`:""}${o.t?`<b>${o.t}</b>`:""}${o.sub?`<small>${o.sub}</small>`:""}</span></label>`).join("")}</div>`; }
function chk(p, label){ return `<label class="check"><input type="checkbox" data-p="${p}" ${get(p)?"checked":""}><span>${label}</span></label>`; }
function rubric(p, d){ return `<div class="domain-h"><h3>${d.naam}</h3><span class="q">${d.vraag}</span></div>` + radios(p, d.niveaus.map((t,i)=>({v:i+1, sub:t, lvl:true})), "cols4", true); }
function live(name, arg=""){ return `<div data-live="${name}" data-arg="${esc(arg)}">${LIVE[name](arg)}</div>`; }
function example(title, text){ return `<details><summary>${title}</summary><div class="ex">${text}</div></details>`; }

function status(id){
  const m = MOM[id], d = S.m[id];
  if (d && d.klaar) return "klaar";
  const extra = id==="actieplan" ? hasContent(S.doelenA) : id==="tussen" ? hasContent(S.doelenB) : false;
  return (hasContent(d) || extra) ? "bezig" : "leeg";
}
const STATUSTXT = { leeg:"nog niet begonnen", bezig:"bezig", klaar:"ingevuld", slot:"op slot", laat:"niet ingeleverd", samen:"samengevoegd" };
function nuId(){
  const today = new Date().toISOString().slice(0,10);
  const open = CONFIG.momenten.filter(m => status(m.id) !== "klaar");
  const due = open.find(m => m.datum >= today);
  return (due || open[open.length-1] || {}).id;
}
function momentHead(id, lead){
  const m = MOM[id];
  const tw = m.tw ? CONFIG.toetsweken[m.tw] : null;
  return `<h1>${esc(m.titel)}</h1><div class="meta">
    <span class="pill ${m.spoor==="toets"?"warm":m.spoor==="lob"?"lob":""}">${SPOORNAAM[m.spoor]}</span>
    <span class="pill">week ${m.week}</span>${m.datum?`<span class="pill">klaar op ${fmtDate(m.datum)}</span>`:""}
    ${tw?`<span class="pill warm">toetsweek ${m.tw}: ${fmtDate(tw.van)} – ${fmtDate(tw.tot)}</span>`:""}
    ${m.mol?`<span class="pill warm">gespreksstuk ${esc(m.mol)}</span>`:""}</div><p class="lead">${lead}</p>`;
}
function klaarBox(id){
  const k = S.m[id] && S.m[id].klaar;
  return `<div class="card soft klaarbox"><div><b>${k?"Afgerond op "+new Date(k).toLocaleDateString("nl-NL"):"Klaar met dit onderdeel?"}</b><div class="small">${k?"Je kunt nog steeds dingen aanpassen.":"Markeer het als ingevuld. Maak daarna je PDF bij Opslaan en delen als je mentor erom vraagt."}</div></div>
  <button class="btn ${k?"ghost":""}" data-act="klaar" data-id="${id}">${k?"Toch nog niet klaar":"Ik ben klaar"}</button></div>`;
}
function pager(id){
  const i = CONFIG.momenten.findIndex(m => m.id === id), p = CONFIG.momenten[i-1], n = CONFIG.momenten[i+1];
  return `<div class="pager">${p?`<button class="btn ghost" data-go="${p.id}">← ${esc(p.titel)}</button>`:"<span></span>"}${n?`<button class="btn ghost" data-go="${n.id}">${esc(n.titel)} →</button>`:""}</div>`;
}

function meting(prefix, titel, sub){
  let h = `<div class="card"><h2>${titel}</h2><p class="sub">${sub}</p>`;
  DOMEINEN.forEach(d => h += rubric(`${prefix}.${d.id}`, d));

/* doelen */
function doelLabel(set, i){
  const d = get(`${set}.${i}`) || {};
  if (i === 0) return d.vak ? `Vakdoel: ${d.vak}` : "Vakdoel";
  const dom = DOMEINEN.find(x => x.id === d.domein);
  return dom ? `Doel voor ${dom.naam.toLowerCase()}` : "Doel voor motivatie, werkhouding of organisatie";
}
function clean(s){ return esc(String(s).trim().replace(/[.\s]+$/,"")); }
function doelZin(d){
  d = d || {};
  if (!d.specifiek) return `<div class="zin leeg">Hier verschijnt je doel in één zin zodra je het invult.</div>`;
  let s = clean(d.specifiek) + ".";
  if (d.meetbaar) s += ` Ik weet dat het gelukt is als ${clean(d.meetbaar)}.`;
  if (d.datum) s += ` Uiterlijk ${fmtDate(d.datum)}.`;
  if (d.als && d.dan) s += `<br><b>Als</b> ${clean(d.als)}, <b>dan</b> ${clean(d.dan)}.`;
  return `<div class="zin">${s}</div>`;
}
function smartCheck(d){
  d = d || {};
  const M = /\d|keer|per |elke|iedere|minimaal|minstens|cijfer|uur|minuten|dagen|week/i;
  const c = [["S",(d.specifiek||"").trim().length>=20,"Specifiek: beschrijf precies wat je gaat doen of bereiken."],
             ["M",M.test(d.meetbaar||""),"Meetbaar: noem iets wat je kunt tellen of zien (aantal, cijfer, keer per week)."],
             ["A",(d.haalbaar||"").trim().length>=8,"Acceptabel: leg uit waarom het haalbaar is en toch uitdagend."],
             ["R",(d.relevant||"").trim().length>=8,"Relevant: schrijf op waarom dit belangrijk is voor jou."],
             ["T",!!d.datum,"Tijdgebonden: kies een datum."]];
  const miss = c.filter(x=>!x[1]).map(x=>x[2]);
  return `<div class="badges" aria-label="SMART-check">${c.map(x=>`<span class="badge ${x[1]?"on":""}" title="${esc(x[2])}">${x[0]}</span>`).join("")}</div>` +
    (miss.length ? `<div class="small">Nog doen: ${miss[0]}</div>` : `<div class="small" style="color:var(--ok)">Je doel is SMART.</div>`);
}
function bronHint(set){
  const s = get("m.actieplan.swot") || {}, t = [];
  const zw = [s.w1,s.w2].filter(Boolean), bd = [s.b].filter(Boolean);
  if (zw.length) t.push(`<b>Zwaktes uit je SWOT:</b> ${zw.map(esc).join("; ")}`);
  if (bd.length) t.push(`<b>Bedreiging:</b> ${bd.map(esc).join("; ")}`);

    if (an.length) t.push(`<b>Na de toetsweken nam je je voor:</b> ${an.map(esc).join("; ")}`);

const stepIdx = {};
function stepped(id, steps){
  const i = Math.min(stepIdx[id] || 0, steps.length-1);

  h += `<div class="row end">${i>0?`<button class="btn ghost" data-step="${id}:${i-1}">← Vorige stap</button>`:"<span></span>"}${i<steps.length-1?`<button class="btn" data-step="${id}:${i+1}">Volgende: ${steps[i+1].t} →</button>`:""}</div>`;
  return h;
}

    else { const st = momentGeblokkeerd(it.id) ? "slot" : status(it.id);

  });
  return h + `</div>`;
}

/* ---------- PDF-rapport ---------- */
function qa(label, v, p){ return filled(v) ? `<div class="qa"><b>${label}</b><div>${esc(v)}</div>${p?metaNote(p):""}</div>` : ""; }
function qp(label, p){ return qa(label, get(p), p); }
function scoreTxt(p, d){ const v = get(p); return v ? `${v} – ${d.niveaus[v-1]}` : ""; }
function rMeting(prefix){
  let h = DOMEINEN.map(d => qa(d.naam, scoreTxt(`${prefix}.${d.id}`, d))).join("");
  const rows = S.vakken.map(v => { const k = vkey(v), s = get(`${prefix}_vak.${k}`), a = get(`${prefix}_aandacht.${k}`);
    return (s||a) ? `<tr><td>${esc(v)}</td><td>${s?s+" ("+VAKLABEL[s]+")":"–"}</td><td>${a?"ja":""}</td></tr>` : ""; }).join("");
  return h + (rows ? `<table><thead><tr><th>Vak</th><th>Hoe gaat het</th><th>Aandacht</th></tr></thead><tbody>${rows}</tbody></table>` : "");
}

function rWelzijn(id){ const w = get(`m.${id}.welzijn`)||{}; if (!w.delen || !w.score) return ""; return qa("Hoe het met me gaat", `${w.score} – ${WELZIJN.find(o=>o.v==w.score).t}${w.toelichting?"\n"+w.toelichting:""}`); }
function rMol(id){ return qp("Afspraken uit het MOL-gesprek", `m.${id}.mol.afspraken`) + qp("Wat ik meenam uit het gesprek", `m.${id}.mol.meegenomen`); }
function rEval(id,set){ return [0,1].map(i => { const e = get(`m.${id}.eval.${i}`)||{}, d = get(`${set}.${i}`)||{}; if (!d.specifiek) return "";

function rCheckin(id,set){ return [0,1].map(i => { const c = get(`m.${id}.doel.${i}`)||{}, d = get(`${set}.${i}`)||{}; if (!d.specifiek || !hasContent(c)) return "";
  return `<h3>Check doel ${i+1}: ${esc(d.specifiek)}</h3>` + qa("Als-dan-plan uitgevoerd",c.plan) + qa("Dichter bij doel",{1:"Nee",2:"Een beetje",3:"Ja",4:"Al gehaald"}[c.dichterbij]) + qp("Wat werkt en wat niet",`m.${id}.doel.${i}.werkt`) + qa("Huidig als-dan-plan",d.als&&d.dan?`Als ${d.als}, dan ${d.dan}`:""); }).join(""); }

function cyrb53(str, seed = 0){ let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0); }

}

    <div class="card"><h2>Wat is de jaarlijn?</h2>
      <p>Leerlingen houden in de tool het hele jaar zelf hun ontwikkeling bij: kennis en vaardigheden, motivatie, werkhouding en organisatie. Het jaar heeft drie sporen: <b class="c-leerling">mijn ontwikkeling</b> (actieplan, spiegel, tussenbalans, eindbalans), <b class="c-toets">toetsweken</b> (voor elke toetsweek een plan, erna een terugblik) en <b class="c-lob">LOB</b> (de drie delen van het LOB-dossier).</p>
      <p>Elke week is er een les met een terugblik, een opdracht en een afsluiting. De leerling levert elke les in als PDF via Teams. Het tijdstip en de getypte tijd per opdracht komen daar automatisch in te staan; de leerling hoeft daar niets voor te doen. Op de gespreksmomenten kan een leerling pas verder na een gesprek met jou.</p>

    <div class="card"><h2>Jaarplanners</h2><p class="sub">Per les wat jij doet en wat de leerlingen doen, met data, toetsweken en MOL-gesprekken. Voor Word.</p>
      <div class="row"><a class="btn ghost small" href="Jaarplanner_mentorlessen_havo4_hele_klas_2026-2027.docx">Mentor · hele klas</a><a class="btn ghost small" href="Jaarplanner_leerlingen_havo4_hele_klas_2026-2027.docx">Leerling · hele klas</a><a class="btn ghost small" href="Jaarplanner_mentorlessen_H4E_2026-2027.docx">Mentor · halve klas (voorbeeld H4E)</a><a class="btn ghost small" href="Jaarplanner_leerlingen_H4E_2026-2027.docx">Leerling · halve klas (voorbeeld H4E)</a></div></div>

  handleiding: () => `<h1>Handleiding</h1><p class="lead">Zo haal je het meeste uit de tool, en zo zorg je dat leerlingen hun werk goed maken.</p>
    <div class="card"><h3 style="margin-top:0">Elke week: de controlestrook</h3><p>Bovenaan elke weekpdf staan tijdstip, getypte tijd sinds de vorige PDF, of de afsluiting is ingevuld en de eigen kwaliteitscheck van de leerling. Dat check je in tien seconden. Lees het werk helemaal bij de grote momenten (actieplan, terugblik A, tussenbalans, toetsweekplan C, eindbalans) en bij twijfel. Een lang antwoord in weinig typtijd, of veel ‘niet getypte’ tekens, is een reden om door te vragen, geen bewijs.</p>
    <h3>Laat leerlingen hun werk uitleggen</h3><p>Kies in een gesprekje één antwoord uit de PDF: “Leg eens uit wat je hiermee bedoelt.” “Geef eens een voorbeeld uit deze week.” “Wat ga je morgen concreet anders doen?” Wie het zelf schreef, kan dat in twee minuten. Dit is sterker dan elke technische controle.</p>

    <h3>Houd het klein</h3><p>Een les kost 20 à 25 minuten. Voeg niets toe.</p>

    <h3>Lessen inkorten of doorschuiven</h3><p>Valt een les uit of heb je minder tijd? Op de pagina <a href="#mentor/planning">Planning aanpassen</a> maak je een les kort, voeg je hem samen met de volgende les, of laat je hem zelfstandig doorgaan. Je krijgt een nieuwe klaslink die je in Teams zet. Schuif lessen met een deadline liever niet door maar maak ze kort: de jaarlijn hangt vast aan de toetsweken en MOL-gesprekken.</p>
    <h3>Na inleveren op slot</h3><p>Na de PDF gaat de les op slot. Wie daarna nog iets verandert, moet de les heropenen en een nieuwe PDF maken; in die PDF staat dat de les heropend is.</p>
    <h3>Back-ups</h3><p>Bij elke PDF maakt de tool automatisch een back-up in Downloads. Oefen in de eerste les één keer samen hoe die naar OneDrive gaat. Leerlingen met Safari (Mac, iPad) raden we Chrome of Edge aan: Safari wist gegevens van websites die zeven dagen niet gebruikt zijn.</p>
    <h3>Wat de tool niet kan</h3><p>Alles gebeurt op het apparaat van de leerling. Klok verzetten, een back-up bewerken of de broncode lezen omzeilt de controles. Het inlevertijdstip in Teams is betrouwbaar. De tool is een drempel en een spiegel, geen bewijsmiddel.</p>
    <h3>Privacy</h3><p style="margin:0">Er gaat niets naar een server. Welbevinden komt alleen in de PDF als de leerling dat aanvinkt. De tool meet typtijd en vertelt dat aan de leerling. Informeer ook ouders (bijvoorbeeld bij MOL-gesprek 1) en leg de werkwijze voor aan de privacyfunctionaris.</p></div>`
};

function mentorRijen(w){
  return MENTORLES.map(r => {
    const heel = w === "heel";
    const titel = r.les ? (heel ? r.bh : r.blok) : r.blok;
    const nb = heel ? r.nbHeel : r.nb;
    let leerl = [];
    if (r.les){ if (heel) leerl.push(["Leerlingen", r.ltHeel]); else { leerl.push([`In de klas (groep ${r.g})`, r.sk]); leerl.push([`Thuis (groep ${r.g===1?2:1})`, r.st]); } }
    else if (r.st) leerl.push(["Leerlingen", r.st]);
    return { ...r, titel, nbW: nb, mkW: r.les ? (heel ? r.mkHeel : r.mk) : "", leerl, spoor: spoorVan(titel) };
  });
}

function maakBackup(extra){
  try {
    S.ui.lastBackup = Date.now(); save();
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}), url = URL.createObjectURL(blob), link = document.createElement("a");
    const naam = (S.leerling.voornaam || "leerling").toLowerCase().replace(/[^a-z0-9]+/g,"-");
    link.href = url; link.download = `jaarlijn-${naam}${extra ? "-" + extra : ""}-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ toast("De back-up kon niet worden gemaakt. Probeer het bij Opslaan en delen."); }
}

function backupWaarschuwing(){
  const heeftWerk = hasContent(S.m) || hasContent(S.lessen) || hasContent(S.doelenA);
  let h = "";
  if (IS_SAFARI) h += `<div class="alert"><b>Je gebruikt Safari.</b> Safari wist opgeslagen gegevens van een website die je zeven dagen niet gebruikt, bijvoorbeeld na een vakantie. Gebruik liever Chrome of Edge. Blijf je Safari gebruiken, bewaar dan elke back-up in je OneDrive.</div>`;
  if (heeftWerk && (!S.ui.lastBackup || Date.now() - S.ui.lastBackup > 7*24*3600*1000))
    h += `<div class="alert klaarbox"><div><b>${S.ui.lastBackup ? "Je laatste back-up is van " + fmtTs(S.ui.lastBackup) + "." : "Je hebt nog geen back-up gemaakt."}</b> Maak er nu een en zet hem in je OneDrive.</div><button class="btn small" data-act="backup">Back-up maken</button></div>`;
  if (!heeftWerk && S.ui.privacyOk) h += `<div class="note klaarbox"><div>Heb je al eerder in de tool gewerkt en is alles weg? Zet dan je laatste back-up terug. Die staat in je OneDrive of in je map Downloads.</div><button class="btn small ghost" data-act="restore">Back-up terugzetten</button></div>`;
  return h;
}

function onField(e){
  const el = e.target;
  if (el.dataset.vak !== undefined){ const v = el.dataset.vak; S.vakken = el.checked ? Array.from(new Set([...S.vakken, v])) : S.vakken.filter(x => x !== v); save(); return; }
  const p = el.dataset.p; if (!p) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.n !== undefined && v !== "") v = Number(v);
  set(p, v);
  if (el.dataset.rerender !== undefined){ const tr = el.closest("tr"); if (tr) tr.classList.toggle("off", !el.checked); }
  const lab = p.match(/^(doelen[AB])\.(\d)\.(vak|domein)$/);
  if (lab){ const s = document.querySelector(`[data-doellabel="${lab[1]}.${lab[2]}"]`); if (s) s.textContent = doelLabel(lab[1], +lab[2]); }
  refreshLive(); renderNav();
}

  if (act === "addVak"){ const v = $("#nieuwVak").value.trim(); if (v && !S.vakken.includes(v)){ S.vakken.push(v); save(); render(); } }
  if (act === "klaar"){ const id = a.dataset.id; S.m[id] = S.m[id] || {}; S.m[id].klaar = S.m[id].klaar ? null : new Date().toISOString(); save(); render(); }
  if (act === "addFb"){ const fb = get("m.spiegel.fb") || []; fb.push({}); set("m.spiegel.fb", fb); render(); }
  if (act === "delFb"){ const fb = get("m.spiegel.fb") || []; fb.splice(+a.dataset.i, 1); set("m.spiegel.fb", fb); render(); }
  if (act === "copyVraag"){ const t = $("#fbVraag"), done = () => $("#copied").textContent = "Gekopieerd.";
    const fallback = () => { t.select(); document.execCommand("copy"); done(); };
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, fallback); else fallback(); }
  if (act === "copyGoal"){ const i = +a.dataset.i, cur = get(`doelenB.${i}`)||{};
    if (hasContent(cur) && !confirm("Doel "+(i+1)+" voor februari is al (deels) ingevuld. Overschrijven?")) return;
    const src = JSON.parse(JSON.stringify(get(`doelenA.${i}`)||{})); src.datum = MOM.eind.datum; S.doelenB[i] = src; save(); render(); }
  if (act === "lesPdf"){ const n = Number(a.dataset.les), b = `lessen.${n}`;
    if (!((isKort(n) || get(`${b}.afsl.gedaan`)) && get(`${b}.afsl.volgende`)) && !confirm("Je afsluiting is nog niet helemaal ingevuld. Toch een PDF maken?")) return;
    const html = buildLesReport(n);
    S.lessen[n] = S.lessen[n] || {}; S.lessen[n].pdf = (S.lessen[n].pdf || []).concat(Date.now()); S.lessen[n].snap = snapshot(); S.lessen[n].locked = true; save();
    $("#print").innerHTML = html; document.title = `Les ${n} - ${S.leerling.voornaam || "leerling"}`; window.print(); document.title = "Mijn jaarlijn havo 4"; maakBackup("les" + n); toast("PDF gemaakt. Je back-up staat in Downloads: zet hem in je OneDrive."); render(); }
  if (act === "heropen"){ const n = Number(a.dataset.les); if (!confirm("Les heropenen? Maak daarna een nieuwe PDF en lever die opnieuw in. In de PDF staat dat je de les hebt heropend.")) return;
    S.lessen[n].locked = false; S.lessen[n].heropend = (S.lessen[n].heropend || []).concat(Date.now()); save(); render(); }
  if (act === "ontgrendel"){ const g = Number(a.dataset.g), inv = ($("#vrij-"+g).value || "").trim(), gs = S.gesprek[g] || {};
    if (CFG().key && inv === vrijgaveCode(CFG().key, gs.code)){ gs.vrij = Date.now(); S.gesprek[g] = gs; save(); toast("Ontgrendeld. Je kunt verder."); render(true); }
    else toast("Deze code klopt niet. Vraag je mentor om de vrijgavecode."); }
  if (act === "mkLink"){ const klas = $("#mk-klas").value.trim(), pin = $("#mk-pin").value.trim(), w = (document.querySelector('input[name="mk-w"]:checked')||{}).value || "half";
    const g = $("#mk-g").value.split(",").map(x => parseInt(x,10)).filter(x => x > 1 && x <= 31);
    if (g.length && !/^\d{4,8}$/.test(pin)){ toast("Kies een pincode van 4 tot 8 cijfers."); return; }
    const q = new URLSearchParams({ klas, w }); if (g.length){ q.set("g", g.join(",")); q.set("k", sleutelUitPin(pin)); }
    const b0 = $("#mk-base").value.trim(); if (!/^https:\/\//.test(b0)){ toast("Het adres moet beginnen met https:// (het adres op GitHub)."); return; }
    const url = b0 + "?" + q.toString();
    $("#mk-out").innerHTML = `<label class="f"><span class="lab">Klaslink</span><textarea readonly rows="3" id="mk-url">${esc(url)}</textarea></label><button class="btn small ghost" data-act="copyLink">Kopieer link</button> <span class="small">Test de link zelf in een privévenster voordat je hem deelt.</span>`; }
  if (act === "copyLink"){ const t = $("#mk-url"); if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast("Link gekopieerd.")); else { t.select(); document.execCommand("copy"); toast("Link gekopieerd."); } }
  if (act === "mPlanPdf"){ mentorPlanPdf(); return; }
  if (act === "plLoad"){ plLaad(); return; }
  if (act === "plMake"){ plMaak(); return; }
  if (act === "plReset"){ if (PL){ PL.adj = {}; render(); } return; }
  if (act === "mkVrij"){ const pin = $("#vg-pin").value.trim(), code = $("#vg-code").value.trim().toUpperCase();
    if (!/^\d{4,8}$/.test(pin) || !/^\d+-[A-Z0-9]{4}$/.test(code)){ toast("Vul je pincode en een aanvraagcode zoals 9-K7F3 in."); return; }
    $("#vg-out").innerHTML = `<div class="codebox"><div><span class="small">Vrijgavecode voor ${esc(code)}</span><b>${vrijgaveCode(sleutelUitPin(pin), code)}</b></div></div>`; }
  if (act === "pdf"){ $("#print").innerHTML = buildReport($("#pdfSel").value); window.print(); }
  if (act === "backup"){ maakBackup(""); render(); }
  if (act === "restore") $("#importFile").click();
  if (act === "wipe"){ if (confirm("Weet je het zeker? Alles op dit apparaat wordt gewist.")){ try { localStorage.removeItem(KEY); } catch(_){} S = blank(); render(true); } }
});
$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const data = JSON.parse(r.result);
      if (!data || data.versie !== 2 || !data.leerling) throw new Error("geen jaarlijn");
      if (!confirm("Je huidige gegevens op dit apparaat worden vervangen door de back-up. Doorgaan?")) return;
      S = Object.assign(blank(), data); save(); render(true); alert("Back-up teruggezet.");
    } catch(err){ alert("Dit bestand is geen geldige back-up van de jaarlijn."); }
    e.target.value = "";
  };
  r.readAsText(f);
});

leesKlaslink();
if (S.ui.privacyOk) vraagBlijvendeOpslag();
render();
if (!storageOk){ const el = $("#save"); el.textContent = "Opslaan niet mogelijk in deze browser"; el.classList.add("err"); }
</script>
</body>
