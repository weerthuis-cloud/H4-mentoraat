<style>
:root{
  /* KSH-kleuren uit het logo */
  --c-leerling:#0a58a3; --c-lob:#2f7d32; --c-mentor:#b3141c; --c-toets:#b35400; --c-geel:#f0a800; --c-studie:#8a6400;
  --bg:#f5f4ef; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#dcd9cf;
  --acc:var(--c-leerling); --acc-soft:#e5eef8; --acc-ink:#ffffff;
  --warm:var(--c-toets); --warm-soft:#fdf0dc; --ok:#2e7d32; --ok-soft:#e7f2e2;
  --lob:var(--c-lob); --lob-soft:#e7f2e2; --geel-soft:#fff4d6; --studie:var(--c-studie); --studie-soft:#f8efd2;
  --b1:#c7d6e8; --b2:#7ea7d2; --b3:#2f73b8; --b4:#0a4a8a; --b5:#f39200;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
body[data-thema="lob"]{ --acc:var(--c-lob); --acc-soft:#e7f2e2; }
body[data-thema="mentor"]{ --acc:var(--c-mentor); --acc-soft:#fbe8e7; }
body[data-thema="studie"]{ --acc:var(--c-studie); --acc-soft:#f8efd2; }
@media (prefers-color-scheme: dark){
  :root{
    --c-leerling:#6aa8e6; --c-lob:#79c27c; --c-mentor:#f07a7f; --c-toets:#f0a24a; --c-geel:#f5c24a; --c-studie:#e0b84a;
    --bg:#15181b; --card:#1e2226; --ink:#e7e9ea; --muted:#a0a7ae; --line:#343a40;
    --acc-soft:#1c2c3d; --acc-ink:#0d1620;
    --warm-soft:#3a2a15; --ok:#79c27c; --ok-soft:#1c3220; --lob-soft:#1c3220; --geel-soft:#3a3010; --studie-soft:#332a10;
    --b1:#3a4a5c; --b2:#34608f; --b3:#4f8fd0; --b4:#8fc0f0; --b5:#f0a24a;
    --shadow:none;
  }
  body[data-thema="lob"]{ --acc-soft:#1c3220; }
  body[data-thema="studie"]{ --acc-soft:#332a10; }
  body[data-thema="mentor"]{ --acc-soft:#3a1c1e; }
}
[hidden]{display:none!important}
h2.mper{margin:26px 0 10px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wkrow{display:grid;grid-template-columns:110px 1fr 210px;gap:14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c-leerling);border-radius:10px;padding:12px 14px;margin:0 0 8px}
.wkrow.s-toets{border-left-color:var(--c-toets)} .wkrow.s-lob{border-left-color:var(--c-lob)}
.wkgv{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);font-size:14px} .wkgv .fase{font-size:12px;font-weight:700;color:var(--c-mentor);text-transform:uppercase;letter-spacing:.03em;margin-right:6px}

function get(p){ return p.split(".").reduce((o,k) => (o == null ? undefined : o[k]), S); }

const $ = s => document.querySelector(s);

function vkey(v){ return String(v).replace(/[.\s]+/g,"_"); }
function fmtDate(iso){ if(!iso) return ""; const d = new Date(iso+"T12:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("nl-NL",{day:"numeric",month:"long"}); }
function filled(v){ return v !== undefined && v !== null && v !== "" && v !== false; }
function hasContent(o){ if (o == null) return false; if (typeof o !== "object") return filled(o);
  return Object.entries(o).some(([k,v]) => k !== "klaar" && k !== "rol" && hasContent(v)); }

/* Volledige zinnen: alle open vragen, behalve losse delen (als/dan), korte logboeknotities, feedbackkreten van anderen, vragenlijsten en bewijsnotities. */
const ZINVRIJ = [/\.(als|dan)$/, /\.log\.\d+\.wat$/, /\.fb\.\d+\.(top|tip)$/, /\.interview$/, /\.arg\.\d+\.bewijs$/];
function zinVeld(p){ return !ZINVRIJ.some(r => r.test(p)); }
const AFK = /(?:^|\s)(?:bijv|bv|enz|etc|ca|nl|blz|min|max|o\.a|d\.w\.z|m\.b\.t|i\.p\.v|t\.o\.v|dr|mr|dhr|mevr|jr|sr|st|nr|evt|incl|excl)$/i;
function zinFouten(t){
  const f = new Set();
  String(t || "").split(/\n/).map(r => r.trim()).filter(Boolean).forEach(r => {
    const kop = r.replace(/^[\s"'‘’“”(\[«»-]+/, ""), staart = r.replace(/[\s"'‘’“”)\]«»]+$/, "");
    if (/^\p{Ll}/u.test(kop)) f.add("hoofdletter");
    if (staart && !/[.!?…]$/.test(staart)) f.add("punt");
    const re = /([^\s.!?]*)[.!?]+\s+["'‘“«]?\p{Ll}/gu; let m;
    while ((m = re.exec(r))){ if (m[1].length > 1 && !AFK.test(" " + m[1])) { f.add("hoofdletter"); break; } }
  });
  return [...f];
}
function zinTekst(f){ if (!f.length) return "";
  const z = [f.includes("hoofdletter") ? "begin elke zin met een hoofdletter" : "", f.includes("punt") ? "sluit elke zin af met een punt" : ""].filter(Boolean);
  return (z.length ? "Volledige zinnen graag: " + z.join(" en ") + ". " : "") + (f.includes("kort") ? "Dit is nog kort: voeg een voorbeeld toe en leg uit waarom." : "");
}
const KORT_WOORDEN = 6; /* onder dit aantal woorden vraagt de tool om een voorbeeld en een waarom */
function zinCheck(el, alleenAls){ const hint = el.parentElement && el.parentElement.querySelector(".zinhint"); if (!hint) return false;
  if (alleenAls && hint.hidden) return false;
  const f = zinFouten(el.value); if (el.value.trim() && woorden(el.value) < KORT_WOORDEN && !/^(ja|nee|deels)\b/i.test(el.value.trim())) f.push("kort");
  const fout = f.length > 0;
  hint.hidden = !fout; hint.textContent = zinTekst(f); el.classList.toggle("zinfout", fout); return fout;
}
const STAP_HTML = {};
function zinStappen(id){ /* welke stappen van dit onderdeel bevatten antwoorden die geen volledige zinnen zijn? */
  const htmls = STAP_HTML[id]; if (!htmls) return null;

  htmls.forEach((h, j) => { t.innerHTML = h; if ([...t.content.querySelectorAll("textarea[data-zin]")].some(el => el.value.trim() && zinFouten(el.value).length)) uit.push(j + 1); });
  return uit;
}
function zinCheckAlles(){ let n = 0; document.querySelectorAll("textarea[data-zin]").forEach(el => { if (el.value.trim()){ zinCheck(el); if (zinFouten(el.value).length) n++; } }); return n; }

    h += `<div class="card"><h2>Per vak</h2><p class="sub">1 = loopt moeizaam, 2 = twijfelachtig, 3 = gaat redelijk, 4 = gaat goed. Vink aan als een vak extra aandacht nodig heeft.</p><div class="tbl-wrap"><table class="vt"><thead><tr><th>Vak</th><th>Hoe gaat het?</th><th>Aandacht</th></tr></thead><tbody>`;

function clean(s){ return esc(String(s).trim().replace(/[.\s]+$/,"")); }
function doelZin(d){

function smartCheck(d, b){
  d = d || {};
  const M = /\d|keer|per |elke|iedere|minimaal|minstens|cijfer|uur|minuten|dagen|week/i;
  const c = [["S",(d.specifiek||"").trim().length>=20,"Specifiek: beschrijf precies wat je gaat doen of bereiken."],
             ["M",M.test(d.meetbaar||""),"Meetbaar: noem iets wat je kunt tellen of zien (aantal, cijfer, keer per week)."],
             ["A",(d.haalbaar||"").trim().length>=8,"Acceptabel: leg uit waarom het haalbaar is en toch uitdagend."],
             ["R",(d.relevant||"").trim().length>=8,"Relevant: schrijf op waarom dit belangrijk is voor jou."],
             ["T",!!d.datum,"Tijdgebonden: kies een datum."]];
  const miss = c.filter(x=>!x[1]).map(x=>x[2]);
  const veld = { S:"specifiek", M:"meetbaar", A:"haalbaar", R:"relevant", T:"datum" };
  return `<div class="badges" aria-label="SMART-check">${c.map(x=>`<button type="button" class="badge ${x[1]?"on":""}" title="${esc(x[2])}" ${b ? `data-veld="${b}.${veld[x[0]]}"` : ""}>${x[0]}</button>`).join("")}</div>` +

}

    const kl = vk.map(v => get(`${vb}.vak.${vkey(v)}.klaarVoor`) || get(`${vb}.vak.${vkey(v)}.klaarNu`)).filter(Boolean);
    const pairs = vk.map(v => [num(get(`${vb}.vak.${vkey(v)}.verwacht`)), num(get(`${na}.cijfer.${vkey(v)}`))]).filter(p=>p[0]!=null&&p[1]!=null);
    const avgB = pairs.length ? pairs.reduce((a,p)=>a+p[1],0)/pairs.length : null, diff = pairs.length ? pairs.reduce((a,p)=>a+(p[1]-p[0]),0)/pairs.length : null;
    const plan = get(`${na}.planning`);
    return `<tr><td>Toetsweek ${tw}</td><td>${kl.length?nl(kl.reduce((a,b)=>a+b,0)/kl.length):"–"}</td><td>${nl(avgB)}</td><td>${diff==null?"–":(diff>0?"+":"")+nl(diff)}</td><td>${plan?["","niet","een beetje","grotendeels","helemaal"][plan]:"–"}</td></tr>`; }).join("");
  if (!rows) return `<p class="muted">Nog geen toetsweken ingevuld.</p>`;
  return `<div class="tbl-wrap"><table class="gap"><thead><tr><th></th><th>Klaar (gem.)</th><th>Behaald (gem.)</th><th>Behaald − verwacht</th><th>Planning gehouden</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- stappen binnen een onderdeel ---------- */
const stepIdx = {};
function stapGevuld(html){ const ps = Array.from(html.matchAll(/data-p="([^"]+)"/g)).map(m => m[1]); return ps.length > 0 && ps.some(p => filled(get(p))); }
function stepped(id, steps){
  const i = Math.min(stepIdx[id] || 0, steps.length-1), n = S.ui.fromLes, dl = (n && MOM[id]) ? lesStappen(n, id) : null;
  const htmls = steps.map(s => s.html()); STAP_HTML[id] = htmls;
  let h = `<div class="stapper-kop"><b>${MOM[id] ? esc(routeKort(id)) : "Studievaardigheden"} in ${steps.length} stappen</b>${dl ? ` <span class="small">· in les ${n} doe je ${dl[0] === dl[1] ? "stap " + dl[0] : "stap " + dl[0] + " tot en met " + dl[1]}</span>` : ""}</div>
    <ol class="stapper">${steps.map((s,j) => { const cur = j === i, ok = stapGevuld(htmls[j]), inLes = dl && j+1 >= dl[0] && j+1 <= dl[1];
      return `<li class="${cur ? "cur" : ""} ${ok ? "ok" : ""} ${inLes ? "dezeles" : ""}"><button data-step="${id}:${j}" ${cur ? 'aria-current="step"' : ""}><span class="nr">${ok ? ikon("check", "#fff") : j+1}</span><span class="t">${s.t}</span>${inLes ? `<span class="tag">les ${n}</span>` : ""}</button></li>`; }).join("")}</ol>`;
  h += htmls[i];
  h += `<div class="row end">${i>0?`<button class="btn ghost" data-step="${id}:${i-1}">← Vorige stap</button>`:"<span></span>"}${i<steps.length-1?`<button class="btn" data-step="${id}:${i+1}">Volgende: ${steps[i+1].t} →</button>`:""}</div>`;
  return h;
}

  const per = d => d < "2026-11-09" ? "Periode 1 · tot en met toetsweek A" : d < "2027-01-25" ? "Periode 2 · tot en met toetsweek B" : d < "2027-04-05" ? "Periode 3 · tot en met toetsweek C" : "Periode 4 · tot de zomer";
  let h = `<div class="legend" style="margin-top:4px"><span><i style="background:var(--acc)"></i>Mijn ontwikkeling</span><span><i style="background:var(--warm)"></i>Toetsweken</span><span><i style="background:var(--lob)"></i>LOB</span>${mod("sv") ? `<span><i style="background:var(--studie)"></i>Studievaardigheden</span>` : ""}</div><div class="tl">`, cur = "";
  items.forEach(it => {
    const p = per(it.datum); if (p !== cur){ h += `<div class="per">${p}</div>`; cur = p; }
    if (it.kind === "e") h += `<div class="ev"><span>wk ${esc(it.week)}</span><span>${esc(it.t)}</span></div>`;
    else if (it.kind === "s"){ const st = svStatus(it.id); h += `<button class="it studie" data-go="studie:${it.j}"><span class="wk">week<b>${esc(it.week)}</b></span><span><b>${esc(it.titel)}</b><small>Studievaardigheden · richttijd: ${esc(it.richt)}</small></span><span class="status ${st}">${STATUSTXT[st]}</span></button>`; }
    else { const st = momentGeblokkeerd(it.id) ? "slot" : status(it.id);

  });
  return h + `</div>`;
}

function qa(label, v, p){ return filled(v) ? `<div class="qa"><b>${label}</b><div>${esc(v)}</div>${p?metaNote(p):""}</div>` : ""; }

function scoreTxt(p, d){ const v = get(p); return v ? `${v} – ${d.niveaus[v-1]}` : ""; }

  const rows = S.vakken.map(v => { const k = vkey(v), s = get(`${prefix}_vak.${k}`), a = get(`${prefix}_aandacht.${k}`);
    return (s||a) ? `<tr><td>${esc(v)}</td><td>${s?s+" ("+VAKLABEL[s]+")":"–"}</td><td>${a?"ja":""}</td></tr>` : ""; }).join("");
  return h + (rows ? `<table><thead><tr><th>Vak</th><th>Hoe gaat het</th><th>Aandacht</th></tr></thead><tbody>${rows}</tbody></table>` : "");
}
function rDoel(set, i){ const d = get(`${set}.${i}`)||{}; if (!d.specifiek) return "";

function rWelzijn(id){ const w = get(`m.${id}.welzijn`)||{}; if (!w.delen || !w.score) return ""; return qa("Hoe het met me gaat", `${w.score} – ${WELZIJN.find(o=>o.v==w.score).t}${w.toelichting?"\n"+w.toelichting:""}`); }
function rEval(id,set){ return [0,1].map(i => { const e = get(`m.${id}.eval.${i}`)||{}, d = get(`${set}.${i}`)||{}; if (!d.specifiek) return "";

function rCheckin(id,set){ return [0,1].map(i => { const c = get(`m.${id}.doel.${i}`)||{}, d = get(`${set}.${i}`)||{}; if (!d.specifiek || !hasContent(c)) return "";
  return `<h3>Check doel ${i+1}: ${esc(d.specifiek)}</h3>` + qa("Als-dan-plan uitgevoerd",c.plan) + qa("Dichter bij doel",{1:"Nee",2:"Een beetje",3:"Ja",4:"Al gehaald"}[c.dichterbij]) + qp("Wat werkt en wat niet",`m.${id}.doel.${i}.werkt`) + qa("Huidig als-dan-plan",d.als&&d.dan?`Als ${d.als}, dan ${d.dan}`:""); }).join(""); }
function rToetsVoor(id){ const b = `m.${id}`, vk = S.vakken.filter(v => get(`${b}.vak.${vkey(v)}.toets`));

  if (id === "lob2") h += qa("Opleidingen",[get(`${b}.opl1`),get(`${b}.opl2`)].filter(Boolean).join("; ")) + qa("Open dagen",[get(`${b}.od1`),get(`${b}.od2`)].filter(Boolean).join("; ")) + qa("Beroepen",trio("beroep")) + qp("Richting", `${b}.richting`) + qp("Veranderd of bevestigd", `${b}.veranderd`) + qp("Twijfel", `${b}.twijfel`) + qp("Interviewvragen", `${b}.interview`) + [1,2].map(n => get(`${b}.odv${n}.waar`) || get(`${b}.odv${n}.gedaan`) ? `<h3>Verslag open dag ${n}</h3>` + qp("Opleiding, school en datum", `${b}.odv${n}.waar`) + qp("Waarom bezocht", `${b}.odv${n}.waarom`) + qp("Gezien en gedaan", `${b}.odv${n}.gedaan`) + qp("Goed en minder goed", `${b}.odv${n}.plusmin`) + qp("Past het bij mij?", `${b}.odv${n}.past`) + qp("Betekenis voor mijn studiekeuze", `${b}.odv${n}.betekenis`) : "").join("");

  return (get(`m.${id}.thuis.getoond`) ? qa("Thuis laten zien", "ja") : "") + (h ? `<div class="ouder"><b>Ingevuld door ouder of verzorger</b>${h}</div>` : ""); }

  organisatie: { t:"De toetsweek organiseren", h:`<p>Een goede toetsweek begint met een planning: wanneer begin je, welke vakken eerst, hoeveel leermomenten per week? Plan terug vanaf de toetsdatum en zet de moeilijkste vakken vooraan.</p><p>Denk ook aan praktische zaken: rooster, slaap, je bijbaan, spullen, en wat je doet als je achterloopt.</p>` },
  terugToets: { t:"Terugkijken op een toetsweek", h:`<p>Vergelijk je verwachte en je behaalde cijfer. Een groot verschil vertelt iets over je zelfinschatting.</p><p>Kijk daarna naar je aanpak, niet alleen naar het cijfer: wanneer begon je, hield je je aan je planning, welke manier van leren werkte? Wat je volgende keer anders doet, zie je terug bij je volgende toetsweekplan.</p>` },
  argument: { t:"Een argument met bewijs", h:`<p>Een argument is een <b>reden plus bewijs</b>. De reden legt uit waarom jouw plan goed is. Het bewijs laat zien dat die reden klopt.</p><p>Soorten bewijs: een cijfer of toetsresultaat, je metingen in de tool, feedback van iemand, of een concreet moment.</p><p class="ex">Wens: ‘Ik wil beter plannen.’<br>Argument: ‘Ik wil beter plannen, want ik begon bij drie vakken pas de avond ervoor met leren, en juist daar haalde ik mijn laagste cijfers.’</p>` },
  tegen: { t:"Wat kan tegenzitten?", h:`<p>Een sterk plan houdt rekening met wat mis kan gaan. Bedenk wat je mentor of je ouder zou kunnen zeggen, en wat jouw antwoord is.</p><p class="ex">‘Dat zei je vorig jaar ook.’ Antwoord: ‘Klopt. Toen had ik geen plan voor als ik ging uitstellen. Nu leg ik mijn telefoon weg en begin ik met twintig minuten.’</p>` },
  spiek: { t:"Je spiekkaart gebruiken", h:`<p>De spiekkaart is een geheugensteun, geen tekst om voor te lezen. Vertel je plan in je eigen woorden en kijk alleen op de kaart als je vastloopt.</p><p>Oefen een keer hardop. Lukt het in één minuut? Dan ben je er klaar voor.</p>` },
  peer: { t:"Goede feedback geven (voor de klasgenoot)", h:`<p>Lees of luister goed, en kijk naar de drie vragen. Geef daarna een top en een tip.</p><p>Een goede <b>top</b> noemt iets precies: niet ‘goed gedaan’, maar ‘je noemt een echt cijfer als bewijs’.</p><p>Een goede <b>tip</b> zegt wat beter kan én hoe: ‘Je kunt je doel meetbaarder maken door te zeggen hoeveel opgaven per week.’</p><p>Feedback gaat over het werk, niet over de persoon.</p>` },
  thuis: { t:"Thuis laten zien", h:`<p>Laat je werk zien en vertel in twee minuten wat je hebt gedaan en wat je ervan leerde. Vraag daarna om een korte reactie.</p><p>Laat je ouder of verzorger zelf typen. In je PDF staat dat het door je ouder of verzorger is ingevuld. Wat je privé houdt, zoals ‘Hoe gaat het met jou?’, hoef je niet te laten zien.</p>` },
  welzijn: { t:"Hoe gaat het met jou?", h:`<p>Dit is alleen voor jou. Het komt pas in je PDF als je aanvinkt dat je mentor het mag zien.</p><p>Gaat het niet goed? Je hoeft niet te wachten tot een gesprek. Je mentor, de leerlingcoördinator of de vertrouwenspersoon helpen je graag.</p>` },
  ef: { t:"Executieve functies", h:`<p>Executieve functies zijn de regelfuncties van je brein. Ze sturen hoe je begint, volhoudt, plant en bijstuurt. SLO noemt er elf, naar Dawson en Guare. Zes sturen je <b>gedrag</b> (zoals op gang komen, je aandacht erbij houden en doorzetten) en vijf hebben met <b>denken</b> te maken (zoals werkgeheugen, plannen en metacognitie).</p><p>Iedereen heeft sterke en zwakke functies. Ze ontwikkelen zich nog tot in je twintiger jaren, en je kunt leren er slim mee om te gaan, bijvoorbeeld met een vaste aanpak of een als-dan-plan. Kies bij elke zin wat meestal voor jou geldt, niet wat je zou willen.</p>` },
  nulmanier: { t:"Hoe leer je nu?", h:`<p>Beschrijf wat je echt doet, niet wat je zou moeten doen. Denk aan leren voor een toets, huiswerk maken en plannen.</p><p>Geef bij elke manier <b>bewijs</b> of <b>argumenten</b>: werkt het, dan noem je een cijfer of een moment. Werkt het niet, dan leg je uit waarom niet.</p><p class="ex">‘Ik lees het hoofdstuk twee keer door. Bij biologie haalde ik een 5,2: ik herkende alles, maar kon het niet zelf uitleggen.’</p>` },
  svkiezen: { t:"Een nieuwe manier kiezen", h:`<p>Lees de manieren in de lijst en zoek er meer over op, bijvoorbeeld met de zoekterm die erbij staat. Kies een manier die je nog niet gebruikte.</p><p>Kijk naar je nulmeting: welke executieve functie scoort bij jou laag? Kies een manier die daarbij helpt. Laat je keuze zien aan je mentor voor akkoord.</p><p>Leg daarna in je eigen woorden uit hoe de manier werkt. Kun je dat niet, dan heb je nog niet genoeg onderzocht.</p>` },
  logboek: { t:"Het logboek", h:`<p>Schrijf na elk oefenmoment twee of drie zinnen: wat deed je, bij welk vak, en hoe ging het? Klein is prima.</p><p class="ex">‘Di 6 okt, Engels: 20 minuten flitskaarten, eerst 12 van 30 goed, na drie rondes 26. Lastig om niet stiekem te kijken.’</p>` },
  proces: { t:"Het proces beschrijven en beoordelen", h:`<p>Kijk terug op alle oefenmomenten samen. Wat ging vanzelf, wat was lastig, wat heb je onderweg aangepast?</p><p>Beoordeel daarna met <b>bewijs</b>: een cijfer in de toetsweek, een score bij het overhoren, hoe lang je geconcentreerd bleef. Ook ‘het werkte niet’ is een goede uitkomst, als je kunt uitleggen waarom.</p>` },
  keuze: { t:"Je keuze voor de lange termijn", h:`<p>Leg je manieren naast elkaar. Kies de manier waarvoor je het beste bewijs hebt, niet de makkelijkste.</p><p>Maak een als-dan-plan, zodat je hem ook gebruikt als het druk wordt, en spreek met jezelf af wanneer je checkt of hij nog werkt.</p>` },
  docent: { t:"Feedback vragen aan een docent", h:`<p>Kies één docent, bij voorkeur van het vak van je vakdoel. Kondig het een week vooraf aan met het bericht, zodat de docent zich kan voorbereiden.</p><p>Houd het kort: twee vragen, twee minuten. Bedank de docent. Schrijf de feedback daarna in je eigen woorden op en bedenk wat je ermee gaat doen. Feedback werkt pas als je er iets mee doet.</p>` },
  afsluiting: { t:"Een goede afsluiting", h:`<p>Een goed antwoord is <b>concreet</b> (je snapt wat er bedoeld wordt), gaat <b>over jou</b> (ik, niet ‘je’ of ‘mensen’) en heeft een <b>voorbeeld</b> uit je eigen schoolweek.</p><p>Je volgende stap is klein en duidelijk: iets wat je deze week echt kunt doen.</p><p class="ex">Zwak: ‘Het ging goed, ik ga zo door.’<br>Sterk: ‘Ik heb mijn toetsweekplan af. Ik merkte dat ik voor Frans pas één week van tevoren wilde beginnen. Volgende stap: zaterdag de woordjes van H3 in flitskaarten zetten.’</p>` },
  profiel: { t:"De profielreflectie", h:`<p>Leg uit waarom je voor je profiel koos en of dat nog klopt. Gebruik wat je uit je tests en je ervaring in havo 4 weet. Wees eerlijk: twijfel mag, als je uitlegt waarover.</p>` },
  pitch: { t:"Je pitch opbouwen", h:`<p>Een pitch is kort en persoonlijk. Begin met wie je bent en wat je drijft, vertel welke richting je op wilt en waarom, en eindig met wat je in havo 5 gaat doen.</p><p>Gebruik voorbeelden uit je LOB-dossier: een test, een open dag, een interview.</p>` },
  interview: { t:"Een interview voorbereiden", h:`<p>Stel open vragen (wat, hoe, waarom) en vraag door. Vraag naar een gewone werkdag, wat iemand leuk en lastig vindt, en welke opleiding hij deed.</p><p class="ex">Niet: ‘Vindt u uw werk leuk?’<br>Wel: ‘Wat maakte uw laatste werkweek goed of juist zwaar?’</p>` }
};

  mol: { t:"Voorbereiding MOL-gesprek", kort:"In het MOL-gesprek ben jij aan het woord: je legt je plan uit en waarom het een goed plan is. Hier bereid je dat voor met argumenten, bewijs en een spiekkaart.", stappen:["Vat je plan in één of twee zinnen samen.","Geef twee argumenten met bewijs: een cijfer, een meting, iets wat iemand zei.","Bedenk wat je mentor of je ouders kunnen tegenwerpen en wat je dan zegt.","Maak je spiekkaart en laat die thuis zien vóór het gesprek. Na het gesprek vul je in wat jullie afspraken."], vast:["Het gesprek zelf staat in de Jaarlijn. Je voorbereiding moet vóór die week klaar zijn.","Geen bewijs? Kijk in <i>Mijn lijn</i> naar je metingen en cijfers."] },
  toetsVoor: { t:"Toetsweekplan", kort:"Vóór de toetsweek: per vak inschatten waar je staat, kiezen hoe je gaat leren en je week plannen. Na de toetsweek kijk je hierop terug.", stappen:["Vul per vak in welk cijfer je verwacht en hoe klaar je bent.","Kies per vak een manier van leren die past bij de toets.","Verdeel je leerwerk over de dagen en maak een als-dan-plan voor het moment dat het misgaat.","Vul in bij welke toets je hulp nodig hebt en van wie."], vast:["Vakken missen? Vink ze aan bij Instellen (tab Deze week).","Je hoeft niet alles in één les te doen; in de les staat welke stap wanneer hoort."] },
  toetsNa: { t:"Terugblik toetsweek", kort:"Na de toetsweek: vergelijk je verwachting met je cijfers en kijk vooral naar je aanpak. Wat je hier leert, gebruik je bij het volgende toetsweekplan.", stappen:["Vul je behaalde cijfers in naast wat je verwachtte.","Beschrijf wat werkte in je manier van leren en wat niet.","Schrijf op wat je de volgende toetsweek anders doet.","Wil je herkansen? Noteer welke toets en waarom."], vast:["Staat een cijfer nog niet in Magister? Vul dat vak later in.","Kijk op de checklist onderaan of je antwoorden concreet zijn."] },
  docentfb: { t:"Feedback van een docent", kort:"Je vraagt één docent om korte feedback op je doel of aanpak bij dat vak, een week van tevoren aangekondigd. Daarna schrijf je op wat je ermee doet.", stappen:["Kies een vak en een docent.","Kopieer de vragen en stuur ze een week vooraf (of vraag het na de les).","Schrijf de feedback in je eigen woorden op.","Vul in wat je ermee gaat doen en vanaf wanneer."], vast:["Reageert de docent niet? Vraag het opnieuw na de les, of kies een andere docent en overleg met je mentor."] },

  lob3: { t:"LOB 3 · Mijn richting", kort:"Je vat je richting samen in één zin, maakt een plan voor havo 5 en bouwt je pitch op.", stappen:["Schrijf je richting in één zin.","Vul in wat je in havo 5 doet om je keuze te maken of te bevestigen.","Bouw je pitch op: wie ben je, wat ontdekte je, welke richting en waarom, je plan. Maximaal vijf minuten.","Na je pitch: schrijf de feedback op en waar je trots op bent."], vast:["Twijfel je nog? Dat mag; schrijf op welke twijfel en hoe je die uitzoekt."] },

function cyrb53(str, seed = 0){ let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;

  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

MPAGES.handleiding = () => `<h1>Handleiding</h1><p class="lead">Wat je elke week doet, wat je doet op bijzondere momenten, en wat alleen geldt als je een extra aanzette.</p>
  <div class="card"><h2>1. Elke week</h2>
    <h3>Opener</h3><p>Begin met de opener die op Deze week en in de digibordles staat (achtergrond: <a href="#mentor/groepsvorming">Groepsvorming</a>). Vijf à acht minuten, niet meer; in een grote groep in viertallen. In een les van 30 minuten sla je hem over.</p>
    <h3>De controlestrook</h3><p>Bovenaan elke PDF staan tijdstip, getypte tijd sinds de vorige PDF, of de afsluiting is ingevuld en de eigen kwaliteitscheck. Dat check je in een halve minuut. Lees het werk helemaal bij de grote momenten (actieplan, terugblik A, tussenbalans, toetsweekplan C, eindbalans) en bij twijfel. Een lang antwoord in weinig typtijd is een reden om door te vragen, geen bewijs. Denkpauzes van meer dan vijf seconden tellen niet mee, dus 25 minuten werk is vaak maar 5 à 10 minuten typtijd. ‘Niet getypt’ kan ook ingesproken tekst of een woordsuggestie op een tablet zijn.</p>
    <h3>Laat leerlingen hun werk uitleggen</h3><p>Kies in een gesprekje één antwoord uit de PDF: “Leg eens uit wat je hiermee bedoelt.” “Geef eens een voorbeeld uit deze week.” Wie het zelf schreef, kan dat in twee minuten.</p>
    <h3>Laat merken dat je leest</h3><p>Reageer elke week op vier of vijf PDF’s met één zin in Teams, steeds andere leerlingen.</p>
    <h3>Maak de norm zichtbaar</h3><p>Een goed antwoord is concreet, gaat over de leerling zelf en heeft een voorbeeld. Dat staat in de tool bij de afsluiting en in de kwaliteitscheck.</p>
    <h3>Ontbrekende PDF</h3><p style="margin:0">Een les waarvan de week voorbij is zonder PDF, staat bij de leerling als ‘niet ingeleverd’. Vaste afspraak: die haalt hij de volgende les eerst in.</p></div>
  <div class="card"><h2>2. Bij bijzondere momenten</h2>
    <h3>MOL-gesprek: de leerling is aan het woord</h3><p>Vraag de leerling te beginnen: “Vertel eens wat je plan is en waarom.” Laat hem uitpraten. Vraag daarna door op het bewijs (“Hoe weet je dat?”) en op het tegenargument (“Wat doe je als het misgaat?”). Pas aan het eind vul jij aan.</p>
    <h3>Een les valt uit of je bent ziek</h3><p>Onverwacht ziek? Dan hoef je niets te doen: elke les is zelfstandig te maken. Wil je lessen inkorten of samenvoegen, gebruik dan <a href="#mentor/planning">Planning aanpassen</a>. Maak lessen met een deadline liever kort dan dat je ze doorschuift.</p>
    <h3>Na inleveren op slot</h3><p>Na de PDF gaat de les op slot. Wie daarna nog iets verandert, heropent de les en maakt een nieuwe PDF; daarin staat dat de les heropend is.</p>
    <h3>Back-ups</h3><p>Bij elke PDF maakt de tool een back-up in Downloads (een .json-bestand). Oefen in les 1 hoe die naar OneDrive gaat. Levert een leerling het .json-bestand in Teams in? Verwijder het dan en laat hem de PDF inleveren: de back-up bevat ook wat hij privé hield. Raad leerlingen met Safari Chrome of Edge aan, en werk niet op een gedeelde computer.</p>
    <h3>Wat de tool niet kan</h3><p>Alles gebeurt op het apparaat van de leerling. Klok verzetten of een back-up bewerken omzeilt de controles. Het inlevertijdstip in Teams is betrouwbaar. De tool is een drempel en een spiegel, geen bewijsmiddel.</p>
    <h3>Privacy</h3><p style="margin:0">De tool bewaart niets op een server: het werk staat op het apparaat van de leerling en gaat alleen als PDF naar Teams. Welbevinden komt alleen in de PDF als de leerling dat aanvinkt. Leg de werkwijze vóór de start voor aan de privacyfunctionaris (de tool staat op GitHub Pages; leerlingwerk gaat via Teams) en informeer ouders vóór les 1, bijvoorbeeld met een brief of op de ouderavond.</p></div>
  <h2 class="mper">3. Alleen als je een extra aanzette</h2>
  <details class="card"><summary>Ouders reageren in de tool</summary><p style="margin-top:10px">Leg bij de kennismakingsavond of MOL-gesprek 1 uit dat de leerling zijn werk vóór elk MOL-gesprek en na elke toetsweek thuis laat zien, en dat de ouder dan zelf een korte reactie typt op het apparaat van de leerling. De reactie komt in de PDF en telt niet mee in de typtijd van de leerling. Vraag in het MOL-gesprek de ouder wat hij of zij schreef.</p></details>
  <details class="card"><summary>Feedback van klasgenoten</summary><p style="margin-top:10px">Op twee momenten: bij de doelen in het actieplan (les 3) en bij het oefenen van de MOL-voorbereiding. De klasgenoot beantwoordt drie vaste vragen met ja, een beetje of nee en geeft een top en een tip, direct in de tool. Laat duo’s wisselen, niet steeds dezelfde vrienden.</p></details>
  <details class="card"><summary>Feedback van een docent</summary><p style="margin-top:10px">Twee keer per jaar vraagt een leerling één docent om korte feedback: in week 47 – 49 en in week 9 – 10. Hij kondigt het een week vooraf aan met een vast bericht met twee vragen. Bewaak de verdeling: hooguit vier verzoeken per docent per klas. Stuur je collega’s vooraf dit bericht:</p>
    <p class="note">Beste collega’s, in de weken 47 – 49 en 9 – 10 vragen havo 4-leerlingen elk één docent om korte feedback op hun vakdoel. Ze kondigen het een week vooraf aan en stellen twee vragen: wat doe ik goed in mijn aanpak, en wat is één ding dat ik kan verbeteren? Het kost u twee minuten na de les of een kort antwoord in Teams. Per klas krijgt u hooguit vier verzoeken. Dank voor uw medewerking!</p></details>
  <details class="card"><summary>Studievaardigheden en executieve functies</summary><p style="margin-top:10px">De nulmeting en de eindkeuze zijn verplicht. De rondes daartussen kiest de leerling zelf; per ronde vinkt hij aan dat jij akkoord bent. Vraag: past deze manier bij wat je nulmeting laat zien? De zelfscan gebruikt de elf executieve functies die SLO noemt (naar Dawson en Guare), verdeeld in doen (gedrag) en denken. Het is een zelfbeeld, geen diagnose. Een leerling die zich op alles laag scoort, spreek je apart.</p></details>
  <details class="card"><summary>Gespreksslot</summary><p style="margin-top:10px">Vanaf de gekozen lessen kan een leerling pas verder na een gesprek met jou. Hij ziet het gesprek in de lessen ervoor aankomen en bereidt het voor. Vanaf het vorige gespreksmoment ziet hij onderaan elke les zijn aanvraagcode. Na het gesprek maak je met je pincode een vrijgavecode (Mijn klas › Gesprek en vrijgavecode). Houd minstens acht lessen tussen twee momenten. Bij de halve klas zie je elke groep in die tijd maar vier keer: spreek dus drie à vier leerlingen per les. Een MOL-gesprek mag meetellen. Bij de halve klas is les 9 een week van groep 1 en zijn les 17 en 25 weken van groep 2 (na de kerst wisselt het ritme); spreek de andere groep in de lessen ervoor, anders zit die thuis op slot.</p><p>Ziek rond een slotles? Voeg die les samen met de volgende (Planning aanpassen); het slot schuift mee. Pincode kwijt? Maak een nieuwe klaslink met een nieuwe pincode; wie al vrij is, blijft vrij. Het slot is een drempel, geen garantie: een handige leerling kan het omzeilen.</p></details>`;

function maakBackup(extra){
  try {
    const naam = (S.leerling.voornaam || "leerling").toLowerCase().replace(/[^a-z0-9]+/g,"-"), bestand = `jaarlijn-${naam}${extra ? "-" + extra : ""}-${new Date().toISOString().slice(0,10)}.json`;
    S.ui.lastBackup = Date.now(); S.ui.lastBackupNaam = bestand; save();
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"}), url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = bestand;
    document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch(e){ toast("De back-up kon niet worden gemaakt. Probeer het bij Opslaan en delen."); }
}

  if (act === "copyDocent"){ const t = document.getElementById("dv-" + a.dataset.id); if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast("Bericht gekopieerd.")); else { t.select(); document.execCommand("copy"); toast("Bericht gekopieerd."); } return; }
  if (act === "spiek"){ const id = a.dataset.id; $("#print").innerHTML = `<img src="${LOGO}" alt="KSH" style="height:30px;margin-bottom:6pt"><h1>Spiekkaart ${esc(MOM[id].gesprek.split("·")[0].trim())} · ${esc(S.leerling.voornaam||"")}</h1>` + spiekHTML(id); const oud = document.title; document.title = "Spiekkaart " + MOM[id].gesprek.split("·")[0].trim(); window.print(); document.title = oud; return; }
  if (act === "pdf"){ $("#print").innerHTML = buildReport($("#pdfSel").value); window.print(); }
  if (act === "backup"){ maakBackup(""); toast(`Back-up ${S.ui.lastBackupNaam || ""} gedownload naar ${IS_IPAD ? "Bestanden › Downloads" : "je map Downloads"}. Zet hem in je OneDrive.`); render(); }
  if (act === "restore") $("#importFile").click();
  if (act === "wipe"){ if (confirm("Weet je het zeker? Alles op dit apparaat wordt gewist.")){ try { localStorage.removeItem(KEY); } catch(_){} S = blank(); render(true); } }
});
try { $("#save").innerHTML = saveTekst(); } catch(_){}
$("#importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const data = JSON.parse(r.result);
      if (data && data.jaarlijnMentor === 2){ if (!MENTOR) throw new Error("mentorbestand");
        ["mklas","mw","mdagen","mmods","mgates","madj","mlink","mlinkOp"].forEach(k => { S.ui[k] = data[k]; }); save(); render(true); toast("Mentorinstellingen teruggezet."); e.target.value = ""; return; }
      if (!data || data.versie !== 2 || !data.leerling) throw new Error("geen jaarlijn");
      if (!confirm("Je huidige gegevens op dit apparaat worden vervangen door de back-up. Doorgaan?")) return;
      S = Object.assign(blank(), data); save(); render(true); alert("Back-up teruggezet.");
    } catch(err){ alert("Dit bestand is geen geldige back-up van de jaarlijn."); }
    e.target.value = "";
  };
  r.readAsText(f);
});

leesKlaslink();
if (MENTOR && !S.cfg){ S.cfg = { klas:"Voorbeeld", werkwijze:"half", gates:[], key:"" }; }
if (S.ui.privacyOk) vraagBlijvendeOpslag();
render();
if (!storageOk){ const el = $("#save"); el.textContent = "Opslaan niet mogelijk in deze browser"; el.classList.add("err"); }
</script>
